[terminal]
[terminal.shell]
program = "/usr/bin/fish"

[window]
opacity = 0.93
padding = { x = 8, y = 8}

# This strips Alacritty's own title bar/border 
# no minimize/maximize/close buttons drawn by Alacritty itself. 
decorations = "None" 

[font]
size = 12.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[keyboard]
bindings = [
    { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
]


